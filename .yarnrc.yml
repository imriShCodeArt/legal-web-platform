nodeLinker: node-modules

# A package can resolve only dependencies declared in its own manifest.
nmHoistingLimits: dependencies

checksumBehavior: throw
enableStrictSsl: true

# The Next ESLint plugin never declares the eslint peer its utilities require.
packageExtensions:
  "@next/eslint-plugin-next@*":
    peerDependencies:
      eslint: "*"
